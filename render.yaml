services:
  - type: web
    name: laptophub
    runtime: python
    plan: free
    buildCommand: "echo 'No build step needed'"
    startCommand: "python server.py"
    envVars:
      - key: PORT
        generateValue: false
    disk:
      name: laptophub-data
      mountPath: /opt/render/project/src/db
      sizeGB: 1
