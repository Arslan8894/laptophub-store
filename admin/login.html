<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LaptopHUB Admin — Secure Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #090a0f;
  --surface: #12141e;
  --border: rgba(255, 255, 255, 0.08);
  --border2: rgba(255, 255, 255, 0.14);
  --accent: #4c7cff;
  --danger: #ef4444;
  --muted: #8b93ad;
  --text: #f0f2f8;
  --text2: #9ca3af;
}
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 18px;
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
}
.logo {
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.logo span { color: var(--accent); }
.sub {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.badge-secure {
  background: rgba(16, 185, 129, 0.12);
  color: #10b981;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text2);
  margin-bottom: 6px;
}
input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, background-color 0.2s;
  margin-bottom: 18px;
}
input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.07);
}
button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
button:hover { opacity: 0.92; transform: translateY(-1px); }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.err {
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  margin-top: 14px;
  display: none;
  line-height: 1.4;
}
.back {
  display: block;
  text-align: center;
  margin-top: 22px;
  font-size: 13px;
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s;
}
.back:hover { color: var(--text); }
</style>

<!-- Firebase SDKs (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
</head>
<body>

<div class="card">
  <div class="logo">Laptop<span>HUB</span></div>
  <div class="sub">
    <span>Admin Control Center</span>
    <span class="badge-secure">🔒 Cloud Auth</span>
  </div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <label for="email">Admin Email</label>
    <input id="email" type="email" placeholder="admin@laptophub.pk" autocomplete="username" required>
    
    <label for="password">Admin Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
    
    <button id="btn" type="submit">Sign In to Admin Panel</button>
    <div class="err" id="errMsg"></div>
  </form>

  <a class="back" href="../laptophub.html">← Return to Storefront</a>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('errMsg');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = 'Verifying credentials…';
  err.style.display = 'none';

  // 1. Primary Authentication: Firebase Auth
  const { isConfigured, auth } = initFirebase();
  if (isConfigured && auth) {
    try {
      const userCred = await auth.signInWithEmailAndPassword(email, password);
      sessionStorage.setItem('laptophub_admin_auth', 'true');
      window.location.replace('./');
      return;
    } catch (fbErr) {
      console.warn('[LaptopHUB] Firebase Auth failed:', fbErr);
      err.textContent = fbErr.message || 'Invalid administrator email or password.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In to Admin Panel';
      return;
    }
  }

  // 2. Local Fallback: If Firebase is not yet configured, attempt local Python server login
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      sessionStorage.setItem('laptophub_admin_auth', 'true');
      window.location.replace('./');
    } else {
      err.textContent = data.error || 'Login failed. Please check your credentials.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In to Admin Panel';
    }
  } catch (netErr) {
    // If neither Firebase nor server.py responded
    err.innerHTML = 'Authentication server unreachable.<br><small style="opacity:0.8">Configure your Firebase Project credentials in <code>js/firebase-config.js</code> or run <code>python server.py</code> locally.</small>';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In to Admin Panel';
  }
}

// Redirect immediately if already signed in
(async () => {
  const { isConfigured, auth } = initFirebase();
  if (isConfigured && auth) {
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.replace('./');
      }
    });
  } else {
    try {
      const r = await fetch('/api/admin/me', { credentials: 'include' });
      if (r.ok) window.location.replace('./');
    } catch (_) {}
  }
})();
</script>

</body>
</html>
